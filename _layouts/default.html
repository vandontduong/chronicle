<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <header class="bar">
    <a class="mark" href="{{ '/' | relative_url }}">Chronicle</a>
    <nav>
      <a href="{{ '/timelines/' | relative_url }}"{% if page.url == '/timelines/' %} class="here"{% endif %}>Map</a>
      <a href="{{ '/timelines/capability-stack/' | relative_url }}"{% if page.url contains '/capability-stack' %} class="here"{% endif %}>Stack</a>
      <a href="{{ '/timelines/lab-fission/' | relative_url }}"{% if page.url contains '/lab-fission' %} class="here"{% endif %}>Fission</a>
      <a href="{{ '/timelines/clouds/' | relative_url }}"{% if page.url contains '/clouds' %} class="here"{% endif %}>Clouds</a>
    </nav>
  </header>
  <main>
    {% unless page.url == '/' %}
    <p class="crumbs">
      <a href="{{ '/' | relative_url }}">Chronicle</a>
      · <a href="{{ '/timelines/' | relative_url }}">Map</a>
      · {{ page.title }}
    </p>
    {% endunless %}
    {{ content }}
  </main>
  <footer>
    {% include sitemap.html %}
    <p class="note">Working notes. Citations stay on arXiv.</p>
  </footer>
</body>
</html>
